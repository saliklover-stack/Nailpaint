kind = "web"
previewPath = "/"
title = "Nail Business Manager"
description = "A mobile-friendly manufacturing and business management app for nail-paint businesses, covering raw materials, production recipes, stock, sales, payments, expenses, profit, and reports."
version = "1.0.0"
id = "artifacts/nail-business-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22660

[services.development]
run = "pnpm --filter @workspace/nail-business-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nail-business-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/nail-business-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22660"
BASE_PATH = "/"
